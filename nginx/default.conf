server {
    listen 80;
    server_name latte.localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name latte.localhost;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $pane_fastcgi_upstream app:9000;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    location = /pane {
        rewrite ^ / break;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI /$is_args$args;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_ORIGIN $scheme://$host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_pass $pane_fastcgi_upstream;
    }

    location ^~ /pane/ {
        rewrite ^/pane(/.*)$ $1 break;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param REQUEST_URI $uri$is_args$args;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTP_ORIGIN $scheme://$host;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_pass $pane_fastcgi_upstream;
    }

    location / {
        proxy_pass http://latte:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

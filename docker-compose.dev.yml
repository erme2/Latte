services:
  latte:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: latte
    restart: unless-stopped
    user: "node"
    expose:
      - "5173"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - pane

  latte-nginx:
    image: nginx:1.25-alpine
    container_name: latte-nginx
    restart: unless-stopped
    depends_on:
      - latte
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - pane

networks:
  pane:
    external: true
    name: pane_laravel
